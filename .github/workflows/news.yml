name: weather-news-scraper
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다
  workflow_dispatch:
permissions:
  contents: write
concurrency: news
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: python news_bot/scrape.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 전송 이력 저장
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add news_bot/seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git push)
