name: weather-news-scraper
on:
  schedule:
    - cron: "*/30 * * * *"   # 30분마다 신규 기사 전송
    - cron: "0 8 * * *"      # 매일 17:00 KST(08:00 UTC) 요약본
  workflow_dispatch:
    inputs:
      mode:
        description: "realtime 또는 summary"
        default: realtime
permissions:
  contents: write
concurrency: news
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 실행
        run: |
          if [ "${{ github.event.schedule }}" = "0 8 * * *" ] || [ "${{ inputs.mode }}" = "summary" ]; then
            python news_bot/scrape.py summary
          else
            python news_bot/scrape.py
          fi
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: 전송 이력 저장
        run: |
          git config user.name "news-bot"; git config user.email "news-bot@users.noreply.github.com"
          git add news_bot/seen.json
          git diff --cached --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
